name: Bug report
description: Report a reproducible Sagip testnet problem
title: "bug: "
labels:
  - bug
body:
  - type: input
    id: area
    attributes:
      label: Feature or transaction area
      placeholder: sender check-in
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction
      description: Remove recovery keys, claim links, personal data, session tokens, and private transaction details.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Custody, Stellar, authentication, or privacy impact
